name: IndoorNav

services:
  postgres:
    image: postgres:18-alpine
    container_name: IndoorNav-db
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - IndoorNav-data:/var/lib/postgresql
      - ./db/_entrypoint:/docker-entrypoint-initdb.d
    environment:
      - TZ=Asia/Bangkok
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_APP_USER=${POSTGRES_APP_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD}
    networks:
      - IndoorNav-net

  backend:
    container_name: IndoorNav-backend
    build: ./backend
    ports:
      - ${PORT}:3000
    depends_on:
      - postgres
    networks:
      - IndoorNav-net
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=IndoorNav-db
      - POSTGRES_APP_USER=${POSTGRES_APP_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD}
      - DEBUG=${DEBUG}
    volumes:
      - ./backend/logs:/app/logs
    post_start:
      - command:
          [
            "sh",
            "-c",
            'pnpm run db:migrate | awk ''{ print strftime("[%Y-%m-%d %H:%M:%S]"), $0; fflush(); }'' | tee -a /app/logs/migration.log',
          ]

  frontend:
    container_name: IndoorNav-frontend
    build: ./frontend
    ports:
      - ${NGINX_PORT}:6000
    depends_on:
      - backend
    networks:
      - IndoorNav-net
    environment:
      - NGINX_PROXY=${NGINX_PROXY}

volumes:
  IndoorNav-data:

networks:
  IndoorNav-net: